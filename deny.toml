# License policy (ADR-020): permissive licenses only, so a commercial version
# stays possible. GPL, LGPL and AGPL are never allowed. Before adding a license
# here, check which crate brings it in and record why in docs/decisions.md.

[graph]
targets = [{ triple = "aarch64-apple-darwin" }, { triple = "x86_64-apple-darwin" }]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Narrow, reviewed exceptions. Each pulled in by GPUI, never by DevDesk directly.
exceptions = [
    # Build-time code generator for gpui-pre-apple's Metal bindings. Runs during
    # the build and is not linked into or shipped with DevDesk.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    # Tiny Option helper used by dirs-sys (via GPUI's font-kit). MPL-2.0 is
    # file-level copyleft: shipping it unmodified in a binary is fine; any
    # modification to its files would have to be published. Flagged for the
    # commercial-phase dependency audit (open-questions D-9).
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Rust port of bzip2 (via GPUI's HTTP client compression). The bzip2-1.0.6
    # license is a permissive BSD-style license.
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[licenses.private]
# Our own crates are unpublished and carry no license yet.
ignore = true
