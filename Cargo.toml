[workspace]
resolver = "3"
members = ["crates/tervy-term", "crates/tervy-core", "crates/tervy-app"]
default-members = ["crates/tervy-app"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
publish = false

# Exact pins (ADR-002, ADR-003): GPUI and alacritty_terminal both break between
# minor versions. Upgrade deliberately, between milestones, in a dedicated commit.
[workspace.dependencies]
gpui-kit = "=0.7.1"
alacritty_terminal = "=0.26.0"
async-channel = "2.5"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

tervy-term = { path = "crates/tervy-term" }
tervy-core = { path = "crates/tervy-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

# Pinned registry sources with narrow terminal patches; see vendor/README.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal-0.26.0" }
vte = { path = "vendor/vte-0.15.0" }
