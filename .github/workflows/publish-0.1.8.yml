name: Publish Tervy 0.1.8 installer

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: Temporary HTTPS URL for the notarized installer
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download and verify notarized installer
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOWNLOAD_URL" == https://*.ngrok-free.dev/* ]]
          output="$RUNNER_TEMP/Tervy-0.1.8-macos-arm64.dmg"
          expected_size=14623896
          : > "$output"
          for ((attempt=1; attempt<=200; attempt++)); do
            current_size=$(wc -c < "$output")
            echo "Attempt $attempt: $current_size / $expected_size bytes"
            if [[ "$current_size" -eq "$expected_size" ]]; then break; fi
            [[ "$current_size" -lt "$expected_size" ]]
            curl --http1.1 --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --speed-time 15 --speed-limit 1024 \
              --continue-at - \
              -H 'ngrok-skip-browser-warning: 1' \
              --output "$output" "$DOWNLOAD_URL" || true
            sleep 2
          done
          [[ "$(wc -c < "$output")" -eq "$expected_size" ]]
          printf '%s  %s\n' \
            d5c1279dcaec88a46c63e2bb1144f55f3196fd5bececa71661d05719190ad28a \
            "$output" | sha256sum --check -
      - name: Attach installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: jringeisen/tervy
        shell: bash
        run: gh release upload v0.1.8 "$RUNNER_TEMP/Tervy-0.1.8-macos-arm64.dmg" --clobber
